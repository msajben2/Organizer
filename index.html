<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Organizátor</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PRIHLASOVACIA OBRAZOVKA -->
    <div id="loginScreen" class="auth-container">
        <h2 id="authTitle">Prihlásenie</h2>
        <input type="email" id="emailInput" placeholder="Tvoj E-mail" required>
        <div class="password-wrapper">
            <input type="password" id="passwordInput" placeholder="Heslo" required>
            <span id="togglePassword" class="eye-icon">👁️‍🗨️</span>
        </div>
        <div class="password-wrapper" id="confirmPasswordWrapper" style="display: none; margin-top: 10px;">
            <input type="password" id="confirmPasswordInput" placeholder="Zopakuj heslo">
        </div>
        <button id="mainAuthBtn">Prihlásiť sa</button>
        <p style="text-align: center; margin-top: 10px;">
            <a href="#" id="toggleAuthMode" style="font-size: 14px; color: #28a745; text-decoration: none; font-weight: bold;">Nemáš účet? Zaregistruj sa</a>
        </p>
        <p style="text-align: center; margin-top: 5px;">
            <a href="#" id="forgotPassword" style="font-size: 13px; color: #007bff; text-decoration: none;">Zabudol si heslo?</a>
        </p>
        <p id="authError" style="color: red; display: none; margin-top: 10px; font-size: 14px; text-align: center;"></p>
        <p id="authSuccess" style="color: green; display: none; margin-top: 10px; font-size: 14px; text-align: center;"></p>
    </div>

    <!-- HLAVNÁ APLIKÁCIA -->
    <div class="container" id="appContainer" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h1>Organizátor</h1>
          <div style="display: flex; align-items: center; gap: 10px;">
              <button id="startReviewBtn" style="background-color: #6f42c1; padding: 6px 10px; font-size: 12px; border-radius: 4px; color: white; border: none; cursor: pointer; font-weight: bold;">🌜 Zhodnotiť</button>
              <div id="coinBalance" class="coin-badge">🪙 0</div>
              <button id="logoutBtn" style="background-color: #dc3545; padding: 6px 10px; font-size: 12px;">Odhlásiť</button>
          </div>
    </div>
        
        <div class="calendar-section">
            <div class="calendar-header">
                <button id="prevPeriod">❮</button>
                <h3 id="monthYear"></h3>
                <button id="nextPeriod">❯</button>
            </div>
            <div class="calendar-weekdays">
                <div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div>So</div><div>Ne</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- ROZŠÍRENÁ SEKCIA PRE PRIDÁVANIE ÚLOH -->
        <div class="input-section">
            
            <select id="taskType" style="margin-bottom: 10px; font-weight: bold; background-color: #e6f2ff;">
                <option value="single">📌 Jednorazová úloha</option>
                <option value="weekly">📅 Rutina (Vybrané dni v týždni)</option>
                <option value="interval">🔄 Cyklus (Interval práca / voľno)</option>
            </select>

            <input type="text" id="taskName" placeholder="Názov úlohy (napr. Cvičenie)" required>
            <input type="datetime-local" id="taskTime" required>
            
            <!-- Nastavenia pre Dni v týždni -->
            <div id="weeklyConfig" style="display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 5px; font-size: 14px; padding: 10px; background: #f8f9fa; border-radius: 4px; border: 1px solid #ccc;">
                <label><input type="checkbox" class="day-cb" value="1"> Po</label>
                <label><input type="checkbox" class="day-cb" value="2"> Ut</label>
                <label><input type="checkbox" class="day-cb" value="3"> St</label>
                <label><input type="checkbox" class="day-cb" value="4"> Št</label>
                <label><input type="checkbox" class="day-cb" value="5"> Pi</label>
                <label><input type="checkbox" class="day-cb" value="6"> So</label>
                <label><input type="checkbox" class="day-cb" value="0"> Ne</label>
            </div>

            <!-- Nastavenia pre Interval (napr. 3 dni cvičiť, 1 voľno) -->
            <div id="intervalConfig" style="display: none; gap: 10px; margin-bottom: 5px; padding: 10px; background: #f8f9fa; border-radius: 4px; border: 1px solid #ccc;">
                <div style="flex: 1;"><label style="font-size: 12px;">Aktívne (dni):</label><input type="number" id="intervalActive" min="1" value="3" style="width: 100%;"></div>
                <div style="flex: 1;"><label style="font-size: 12px;">Voľno (dni):</label><input type="number" id="intervalRest" min="1" value="1" style="width: 100%;"></div>
            </div>

            <!-- Dátum ukončenia generovania rutiny -->
            <div id="routineEndConfig" style="display: none; margin-bottom: 10px;">
                <label style="font-size: 13px; color: #555;">Dokedy generovať túto rutinu?</label>
                <input type="date" id="routineEndDate" style="width: 100%;">
            </div>

            <select id="taskPriority" required>
                <option value="low">🟢 Nízka (10 mincí)</option>
                <option value="medium">🟠 Stredná (20 mincí)</option>
                <option value="high">🔴 Vysoká (30 mincí)</option>
            </select>

            <input type="file" id="taskImage" accept="image/*" capture="environment">
            <button id="addTaskBtn">Vygenerovať a Pridať</button>
        </div>

        <div class="task-list-section">
            <h2>Tvoje úlohy</h2>
            <ul id="taskList"></ul>
        </div>
    </div>

    <!-- DETAIL ÚLOHY -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Detail úlohy</h2>
            <p class="modal-info"><strong>Názov:</strong> <span id="modalTaskName"></span></p>
            <p class="modal-info"><strong>Čas:</strong> <span id="modalTaskTime"></span></p>
            <p class="modal-info" id="modalRoutineInfo" style="display: none; font-size: 12px; color: #007bff;">🔄 Súčasť rutiny</p>
            <p class="modal-info"><strong>Odmena:</strong> <span id="modalTaskReward"></span></p>
            
            <img id="modalTaskImage" src="" alt="Fotka k úlohe" style="max-width: 100%; display: none; margin-top: 15px; border-radius: 4px;">
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button id="completeTaskBtn" style="background-color: #28a745;">✅ Splniť úlohu</button>
                <button id="snoozeTaskBtn" class="snooze-btn">⏳ Odložiť o 1 deň</button>
                <button id="deleteTaskBtn" style="background-color: #dc3545;">🗑️ Vymazať trvalo</button>
            </div>
        </div>
    </div>
    <!-- VEČERNÉ ZHODNOTENIE MODAL -->
    <div id="reviewModal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <span class="close-modal" id="closeReviewModal">&times;</span>
            <h2>Večerné zhodnotenie</h2>
            <p id="reviewProgress" style="font-weight: bold; margin-bottom: 15px; color: #007bff;"></p>

            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
                <p class="modal-info"><strong>Úloha:</strong> <span id="reviewTaskName"></span></p>
                <p class="modal-info"><strong>Čas:</strong> <span id="reviewTaskTime"></span></p>
                <p class="modal-info" id="reviewTaskRoutine" style="display: none; font-size: 12px; color: #007bff;">🔄 Súčasť rutiny</p>
                <p class="modal-info"><strong>Odmena:</strong> <span id="reviewTaskReward"></span></p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="reviewCompleteBtn" style="background-color: #28a745;">✅ Splniť</button>
                <button id="reviewSnoozeBtn" class="snooze-btn">⏳ Odložiť na zajtra</button>
                <button id="reviewDeleteBtn" style="background-color: #dc3545;">🗑️ Vymazať</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.error(err)); }); }
    </script>
</body>
</html>
