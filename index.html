<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Organizátor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Organizátor</h1>
        
        <!-- Sekcia Kalendára -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button id="prevPeriod">❮</button>
                <h3 id="monthYear"></h3>
                <button id="nextPeriod">❯</button>
            </div>
            <div class="calendar-weekdays">
                <div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div>So</div><div>Ne</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Dni sa vygenerujú cez JavaScript -->
            </div>
        </div>

        <!-- Sekcia pre pridanie úlohy S TLAČIDLOM NA FOTKU -->
        <div class="input-section">
            <input type="text" id="taskName" placeholder="Názov úlohy (napr. Papierik)" required>
            <input type="datetime-local" id="taskTime" required>
            
            <!-- TOTO JE TO NOVÉ TLAČIDLO PRE FOTKU/SÚBOR -->
            <input type="file" id="taskImage" accept="image/*" capture="environment">
            
            <button id="addTaskBtn">Pridať úlohu</button>
        </div>

        <!-- Zoznam úloh -->
        <div class="task-list-section">
            <h2>Všetky nadchádzajúce úlohy</h2>
            <ul id="taskList">
                <!-- Úlohy sa vygenerujú sem -->
            </ul>
        </div>
    </div>

    <!-- SKRYTÉ VYSKAKOVACIE OKNO (MODAL) PRE DETAIL ÚLOHY -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Detail úlohy</h2>
            <p class="modal-info"><strong>Názov:</strong> <span id="modalTaskName"></span></p>
            <p class="modal-info"><strong>Dátum a čas:</strong> <span id="modalTaskTime"></span></p>
            
            <!-- MIESTO PRE ZOBRAZENIE FOTKY V MODALE -->
            <img id="modalTaskImage" src="" alt="Fotka k úlohe" style="max-width: 100%; display: none; margin-top: 15px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
        </div>
    </div>

    <!-- Pripojenie JavaScriptu -->
    <script type="module" src="script.js"></script>
</body>
</html>
