<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Organizátor</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PRIHLASOVACIA / REGISTRAČNÁ OBRAZOVKA -->
    <div id="loginScreen" class="auth-container">
        <h2 id="authTitle">Prihlásenie</h2>
        <input type="email" id="emailInput" placeholder="Tvoj E-mail" required>
        
        <!-- Heslo 1 -->
        <div class="password-wrapper">
            <input type="password" id="passwordInput" placeholder="Heslo" required>
            <span id="togglePassword" class="eye-icon">👁️‍🗨️</span>
        </div>

        <!-- Heslo 2 (Zobrazí sa len pri registrácii) -->
        <div class="password-wrapper" id="confirmPasswordWrapper" style="display: none; margin-top: 10px;">
            <input type="password" id="confirmPasswordInput" placeholder="Zopakuj heslo">
        </div>

        <button id="mainAuthBtn">Prihlásiť sa</button>
        
        <!-- Prepínanie medzi prihlásením a registráciou -->
        <p style="text-align: center; margin-top: 10px;">
            <a href="#" id="toggleAuthMode" style="font-size: 14px; color: #28a745; text-decoration: none; font-weight: bold;">Nemáš účet? Zaregistruj sa</a>
        </p>
        
        <p style="text-align: center; margin-top: 5px;">
            <a href="#" id="forgotPassword" style="font-size: 13px; color: #007bff; text-decoration: none;">Zabudol si heslo?</a>
        </p>

        <p id="authError" style="color: red; display: none; margin-top: 10px; font-size: 14px; text-align: center;"></p>
        <p id="authSuccess" style="color: green; display: none; margin-top: 10px; font-size: 14px; text-align: center;"></p>
    </div>

    <!-- HLAVNÁ APLIKÁCIA -->
    <div class="container" id="appContainer" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Task Organizátor</h1>
            <button id="logoutBtn" style="background-color: #dc3545; padding: 8px 12px; font-size: 14px;">Odhlásiť sa</button>
        </div>
        
        <div class="calendar-section">
            <div class="calendar-header">
                <button id="prevPeriod">❮</button>
                <h3 id="monthYear"></h3>
                <button id="nextPeriod">❯</button>
            </div>
            <div class="calendar-weekdays">
                <div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div>So</div><div>Ne</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="input-section">
            <input type="text" id="taskName" placeholder="Názov úlohy (napr. Papierik)" required>
            <input type="datetime-local" id="taskTime" required>
            
            <select id="taskPriority" required>
                <option value="low">🟢 Nízka priorita (upozorní 30 min. vopred)</option>
                <option value="medium">🟠 Stredná priorita (upozorní 1 hod. vopred)</option>
                <option value="high">🔴 Vysoká priorita (upozorní 2 hod. vopred)</option>
            </select>

            <input type="file" id="taskImage" accept="image/*" capture="environment">
            <button id="addTaskBtn">Pridať úlohu</button>
        </div>

        <div class="task-list-section">
            <h2>Všetky nadchádzajúce úlohy</h2>
            <ul id="taskList"></ul>
        </div>
    </div>

    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Detail úlohy</h2>
            <p class="modal-info"><strong>Názov:</strong> <span id="modalTaskName"></span></p>
            <p class="modal-info"><strong>Dátum a čas:</strong> <span id="modalTaskTime"></span></p>
            <p class="modal-info"><strong>Priorita:</strong> <span id="modalTaskPriority"></span></p>
            <img id="modalTaskImage" src="" alt="Fotka k úlohe" style="max-width: 100%; display: none; margin-top: 15px; border-radius: 4px;">
            <button id="deleteTaskBtn" style="background-color: #dc3545; width: 100%; margin-top: 20px;">🗑️ Vymazať úlohu</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
